# 블로그 자동 포스팅 설정 — 이 파일만 고치면 됩니다.

drafts_dir = "drafts"   # 초안이 저장될 폴더

[author]
# 키워드의 {지역} 자리에 들어갈 지역명 (예: "울산 북구", "울산 남구")
region = "울산"
nickname = "꼬몽맘"
greeting = "안녕하세요! 꼬몽맘입니다."   # 초안 첫 줄. 주제별로 greeting을 따로 줄 수도 있음

[datalab]
# 네이버 데이터랩 검색어 트렌드 (python -m blog_autopost trends update)
# .env 에 NAVER_CLIENT_ID, NAVER_CLIENT_SECRET 필요
# provider: hub = NAVER API HUB 앱 키(네이버 클라우드 콘솔) / developers = 예전 네이버 개발자센터 키
provider = "hub"
anchor = "텃밭"   # 모든 키워드를 이 검색어의 평균 = 100 으로 환산해 비교
years = 3         # 몇 년치 월별 추이를 볼지

[render]
# center: 붙여넣기용 HTML을 가운데 정렬 (블로그 글 86~100%가 가운데 정렬 — style/README.md 참고)
align = "center"

[site]
# 글공방 웹페이지 (python -m blog_autopost build-web). 다른 블로그용은 config_carso.toml 처럼 파일을 따로 둠
name = "꼬몽맘 글공방"
blog_id = "samil5240"
web_out = "web/blog-writer.html"
trends = "keywords/trends.csv"
brand_font = "Gaegu"
brand_weight = 700
memo_example = "작년 4월 25일 고추 심었다가 냉해, 사진 3장 있음 / 아빠 말: 지온 15도 넘을 때 심어야 함"
own_example = "조경 내역서 작성"
own_title_example = "조경 내역서 작성 방법, 순서대로 알려드려요"

# 작업대의 '화자' 버튼. 첫 번째가 기본. greeting 을 안 적으면 [author] greeting
[[site.voices]]
key = "kkomongmom"
label = "꼬몽맘"
file = "style/voice_kkomongmom.md"

[[site.voices]]
key = "grandpa"
label = "꼬몽할배"
file = "style/voice_kkomong_grandpa.md"
greeting = "안녕하세요, 꼬몽할배입니다."
center = false
note = "이번 글은 운영자의 아빠 꼬몽할배가 화자입니다."

[generator]
# template : 인터넷 없이 글 뼈대(소제목·사진 자리·확인할 것)만 만듦. 무료.
# claude   : Claude API로 초안 전체를 씀. ANTHROPIC_API_KEY 필요 (사용한 만큼 요금).
engine = "template"
model = "claude-opus-5-5"
effort = "medium"          # low | medium | high — 높을수록 꼼꼼하지만 느리고 비쌈
max_tokens = 16000
lookahead_months = 1       # next 명령이 몇 달 앞 키워드까지 미리 쓸지

# ---------------------------------------------------------------- 주제별 설정
# platform : naver(복사·붙여넣기용 HTML 생성) | wordpress(임시글 자동 업로드)
# max_per_day : daily 명령 1회에 만들 최대 초안 수 (0이면 이 주제는 건너뜀)
# persona / audience : 글의 목소리를 정하는 핵심. 블로그 글에서 확인한 내용으로 채웠으니 다르면 고쳐 주세요.
# voice : 문체 가이드 파일. style/voice_kkomongmom.md(꼬몽맘) 또는 style/voice_kkomong_grandpa.md(꼬몽할배)
#         꼬몽할배 목소리로 쓰려면 voice를 바꾸고 greeting = "안녕하세요, 꼬몽할배입니다." 를 추가

[topics.seedling]
name = "육묘장 사장이 알려주는 모종·텃밭"
label = "모종·텃밭"
csv = "keywords/01_seedling_garden.csv"
platform = "naver"
max_per_day = 1
voice = "style/voice_kkomongmom.md"
persona = "울산에서 부모님과 함께 육묘장(모종·고구마순 판매)을 운영하는 꼬몽맘. 아빠(꼬몽할배)는 30여 년 농사와 조경을 해 왔고, 본인은 식물보호기사·식물보호산업기사 자격이 있어 병해충에 밝다. 모종 시즌마다 손님을 직접 맞는 생산자의 눈으로, 초보 텃밭인이 실패하지 않게 알려준다."
audience = "주말농장·베란다·옥상·마당 텃밭을 하는 40~60대 초보와 중급 가드너"

[topics.landscaping]
name = "마당·전원주택 조경 가이드"
label = "조경"
csv = "keywords/02_landscaping.csv"
platform = "naver"
max_per_day = 1
voice = "style/voice_kkomongmom.md"
persona = "가족이 운영하는 조경식재·시설물공사 회사의 여성 대표 꼬몽맘. 현장은 아빠(꼬몽할배)가 30여 년 경력으로 이끌고, 본인은 견적·준공서류·안전관리를 맡는다. 집 옥상정원을 가족이 직접 가꾼다. 거푸집기능사·식물보호기사 보유. 견적과 시공 현장을 솔직하게 설명한다."
audience = "전원주택 건축주, 마당·옥상이 있는 집으로 이사한 사람, 카페·상가 사장님"

[topics.women_biz]
name = "여성 대표의 관급공사·여성기업 실전기"
label = "여성기업·관급"
csv = "keywords/03_women_biz_public.csv"
platform = "naver"
max_per_day = 1
voice = "style/voice_kkomongmom.md"
persona = "울산의 조경식재·시설물공사 회사 여성 대표 꼬몽맘. 여성기업 확인 신청에서 현장 실사와 부적격 통보까지 겪어 봤고, 관급공사 준공서류·퇴직공제부금·안전관리비 정산을 직접 처리한다. 제도는 정확하게, 경험은 솔직하게 쓴다."
audience = "여성기업 인증을 고민하는 대표, 관급공사를 시작하려는 소규모 건설·조경업체"
disclaimer = "이 글은 운영자의 경험과 일반 정보를 정리한 것입니다. 제도·세법·공고 내용은 바뀔 수 있으니 신청 전에 해당 기관 공고나 세무사·행정사 등 전문가에게 꼭 확인하세요."

[topics.bmw]
name = "BMW 오너의 실사용 관리 기록"
label = "BMW"
csv = "keywords/04_bmw.csv"
platform = "naver"         # 워드프레스로 따로 운영하면 "wordpress"로 바꾸고 아래 주석 해제
# wp_env_prefix = "WP_BMW"   # 환경변수 WP_BMW_URL, WP_BMW_USER, WP_BMW_APP_PASSWORD 사용
max_per_day = 1
voice = "style/voice_kkomongmom.md"
# 블로그에 자동차 글이 아직 없어 기존 설정을 유지했습니다. 실제 차종·연식에 맞게 고쳐 주세요.
persona = "BMW를 직접 타고 관리하는 오너이자, 법인 차량을 운용하는 중소기업 여성 대표 꼬몽맘. 정비·비용·세금을 실제 경험 위주로 정리한다."
audience = "BMW 구매를 고민하거나 이미 타고 있는 30~50대 오너, 법인차를 알아보는 사업자"
disclaimer = "차량 정비·사양·세금 정보는 모델과 연식, 시점에 따라 다를 수 있습니다. 정확한 내용은 BMW 공식 서비스센터와 관련 기관에서 확인하세요."
